name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Defaults to v<FyneApp.toml Version>."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A manual run creates the tag with RELEASE_TOKEN, and that tag starts a
  # second run through the push trigger. This job lets the second run skip.
  check:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.existing.outputs.found }}
    steps:
      - name: Check for an existing release
        id: existing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.found != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Resolve release tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/^Version *= *"\(.*\)"/\1/p' FyneApp.toml)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Cross-package Linux + Windows
        run: |
          fyne-cross linux -arch=amd64,arm64
          fyne-cross windows -arch=amd64

      - name: Stage artifacts
        run: |
          mkdir -p release
          for d in fyne-cross/dist/*/; do
            platform=$(basename "$d")
            for f in "$d"*; do
              cp "$f" "release/${platform}-$(basename "$f")"
            done
          done
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: pufferfish-packages
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" release/* \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes
