name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Defaults to v<FyneApp.toml Version>."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Resolve release tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/^Version *= *"\(.*\)"/\1/p' FyneApp.toml)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Cross-package Linux + Windows
        run: |
          fyne-cross linux -arch=amd64,arm64 -env GOTOOLCHAIN=auto -release
          fyne-cross windows -arch=amd64 -env GOTOOLCHAIN=auto -release

      - name: Stage artifacts
        run: |
          mkdir -p release
          for d in fyne-cross/dist/*/; do
            platform=$(basename "$d")
            for f in "$d"*; do
              cp "$f" "release/${platform}-$(basename "$f")"
            done
          done
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: pufferfish-packages
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" release/* \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes

      - name: Open build-number bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(sed -n 's/^Build *= *\([0-9][0-9]*\).*/\1/p' FyneApp.toml)
          NEXT=$((CURRENT + 1))
          sed -i "s/^Build *=.*/Build = $NEXT/" FyneApp.toml

          BRANCH="chore/build-$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add FyneApp.toml
          git commit -m "chore: bump build number to $NEXT [skip ci]"
          git push -f origin "$BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore: bump build number to $NEXT" \
            --body "Automated bump of \`Build\` in FyneApp.toml to $NEXT after release ${{ steps.meta.outputs.tag }}." \
            || echo "A PR for $BRANCH already exists."
